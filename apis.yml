- aid: quora:quora-ads-conversion-api
  name: Quora Ads Conversion API
  tags:
  - Advertising
  - Conversions
  - Marketing
  humanURL: https://www.quora.com/ads/conversion_api_doc
  properties:
  - url: https://www.quora.com/ads/conversion_api_doc
    type: Documentation
  - url: >-
      https://quoraadsupport.zendesk.com/hc/en-us/articles/23065751885069-Conversion-API-Overview
    type: GettingStarted
  - url: https://business.quora.com/api-partners
    type: Partners
  description: >-
    The Quora Ads Conversion API (CAPI) allows advertisers to send events such as website events, app
    installs, and offline conversions directly to Quora Ads Manager. This server-to-server integration
    enables real-time data connections that improve conversion match rates, increasing return on ad spend
    (ROAS) and lowering cost per action (CPA).
